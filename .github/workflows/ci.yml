name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check source syntax
        run: |
          python -m compileall -q aegis
          for script in aegis/*.sh; do bash -n "$script"; done
      - name: Run offline test suite
        env:
          PYTHONPATH: aegis
        run: python -m unittest discover -s aegis/tests -q
