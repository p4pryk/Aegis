name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check source syntax
        run: |
          python -m compileall -q aegis
          for script in aegis/*.sh; do bash -n "$script"; done
      - name: Run offline test suite
        env:
          PYTHONPATH: aegis
        run: python -m unittest discover -s aegis/tests -q
